# Copy to config.yaml (git-ignored) and fill in YOUR profile. Never commit config.yaml.
# All patterns are case-insensitive Python regular expressions.

profile:
  # skill regex -> weight. Matched on word boundaries against title + description.
  skills:
    python: 3
    sql: 3
  match_saturation: 0.35   # fraction of total skill weight that already counts as a full match

filters:
  max_age_days: 7          # only postings published in the last week; the first 24 hours rank higher
  title_include: ['\bdata\b', 'analytics', 'machine learning', '\bML\b', '\bAI\b']
  title_exclude: ['sales', 'recruit']
  seniority:
    accept: ['junior', '\bjr\b', '\bmid\b', 'semi.?senior', '\bssr\b']
    reject_title: ['(?<!semi )(?<!semi-)(?<!semi)\bsenior\b', '\bsr\.?\b', '\blead\b', '\bprincipal\b', '\bstaff\b']
    reject_hint: ['^\s*senior', 'expert', 'lead']   # anchored so "Semi Senior" is not rejected
    max_years_required: 5
  location:
    require_remote: true
    allowed: ['worldwide', 'anywhere']          # region names you can legally work from
    preferred: []                               # subset of allowed that earns a bonus
    neutral: ['^\s*(fully\s+)?remote\s*$']      # location strings that say nothing about region
    blocked_phrases: ['\b(US|USA)\s*only']
  salary:
    min_monthly_usd: 0            # postings whose max is below this are dropped
    target_max_monthly_usd: 0     # above this the posting is flagged "ask-for-more"
    keep_unknown: true            # keep postings without salary (flagged)
    hours_per_month: 160
    fx_to_usd: {USD: 1.0, EUR: 1.08, GBP: 1.27, CAD: 0.72}   # approximate, update as needed
  language:
    english_demanding: ['native english', 'fluent (in )?english', '\bC1\b', '\bC2\b']
    reject_english_demanding: false   # true = drop instead of penalize

near_miss:   # postings that fail ONE soft filter by a small margin are listed separately
  max_extra_years: 2            # requiring up to max_years_required + this many years
  salary_tolerance: 0.15        # salary up to 15% below min_monthly_usd
  include_senior_titles: true   # plain "Senior"/"Sr." titles (never lead/staff/principal/manager)

insights:
  skills_catalog: skills_catalog.yaml   # generic skill list used to compute skill gaps
  gaps_top_n: 15
  gaps_min_count: 2             # ignore skills mentioned by fewer postings
  near_miss_top_n: 15
  track_new: true               # flag postings not seen in previous runs (stored in <output.dir>/seen.json)
  new_retention_days: 120

scoring:   # relative weights
  skills: 40
  seniority: 15
  salary: 15
  location: 15
  language: 15
  freshness: 15   # 1.0 in the first 24 hours, down to 0 at max_age_days

sources:
  remotive:   {enabled: true, categories: [data, artificial-intelligence]}
  jobicy:     {enabled: true, industry: data-science, geos: [null, latam, argentina]}
  himalayas:  {enabled: true, pages: 3, queries: [data analyst, data scientist, data engineer, machine learning, analytics engineer, business intelligence]}
  remoteok:   {enabled: true, tags: [data, analyst, machine-learning]}
  getonbrd:   {enabled: true, categories: [data-science-analytics, machine-learning-ai], pages: 3}
  # Company portals (see README "Company career portals"). Slug = last part of the careers URL.
  greenhouse: {enabled: true, companies: [gitlab, wizeline, canonical, grafanalabs]}   # job-boards.greenhouse.io/<slug>
  lever:      {enabled: true, companies: [toptal, muttdata, despegar]}                 # jobs.lever.co/<slug>
  ashby:      {enabled: true, companies: [supabase, posthog, n8n, airbyte]}            # jobs.ashbyhq.com/<slug>
  workable:   {enabled: true, companies: [platzi]}                                     # apply.workable.com/<slug>
  jobspy:     {enabled: false}   # LinkedIn/Indeed scraping: may violate their ToS, off by default

http:
  user_agent: job-finder/0.1
  timeout: 20

link_check:   # open each listed posting once and drop the ones that are clearly closed (404, "no longer accepting")
  enabled: true
  timeout: 10
  workers: 6        # parallel requests
  max_links: 200    # matches first, then near misses

output:
  dir: output
  top_n: 40
  min_score: 0
  only_new: true   # hide postings shown in earlier runs (needs insights.track_new); --all shows them again
