# Generic catalog of data/ML skills used to detect skill gaps (no personal data: safe to commit).
# Curated by hand and extended with the most frequent tools found in ~435 scraped data postings (Nov 2026).
# name -> case-insensitive regex, matched on word boundaries against posting title + description.
# A skill counts as "covered" when one of your profile.skills keys matches its name (or the other way round).

skills:
  # Languages and query
  Python: python
  SQL: sql
  R: '\bR\b(?! ?&)'
  Scala: scala
  Java: java(?!script)
  Go: golang
  Bash: bash|shell scripting
  # Warehouses and databases
